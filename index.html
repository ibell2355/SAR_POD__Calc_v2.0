<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183859">
  <title>PSAR POD Calculator</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <img class="logo" src="./assets/psar_logo.svg" alt="PSAR Logo">
      <div class="header-title">
        <div>
          <h1>PSAR POD Calculator</h1>
          <p class="subtle">Random Search Model &middot; (v<span id="app-version">&hellip;</span>)</p>
        </div>
        <img class="header-qr" id="header-qr" src="./assets/qrcode.png" alt="QR Code" role="button" tabindex="0">
      </div>
      <div class="header-controls">
        <button class="theme-toggle" id="theme-toggle-btn">Dark Mode</button>
        <div id="connectivity-pill" class="connectivity-pill online">Online / Offline ready</div>
      </div>
    </header>
    <main id="view-root"></main>
    <footer class="build-stamp" id="build-stamp"></footer>
  </div>
  <script>
    /* Clear stale service worker caches from previous versions */
    if (window.caches) {
      caches.keys().then(function (names) {
        names.forEach(function (n) {
          if (n !== 'psar-pod-v17') caches.delete(n);
        });
      });
    }
    /* Detect silent module load failure (stale cache) and prompt refresh */
    window.__psarLoaded = false;
    setTimeout(function () {
      if (!window.__psarLoaded) {
        var root = document.getElementById('view-root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<div style="padding:24px;text-align:center">' +
            '<p style="font-size:1.1rem;font-weight:700;color:#183859">App update requires a fresh reload</p>' +
            '<p style="color:#4e5d6c">Press <strong>Ctrl+Shift+R</strong> (Windows) or <strong>Cmd+Shift+R</strong> (Mac)</p>' +
            '<button onclick="location.reload(true)" style="margin-top:12px;padding:10px 20px;border:1px solid #f57c00;background:#f57c00;color:#fff;border-radius:10px;font:inherit;font-weight:600;cursor:pointer">Reload Now</button></div>';
        }
      }
    }, 3000);
  </script>
  <script type="module" src="./src/main.js"></script>
  <script>
    /* QR code tap-to-enlarge (self-contained, no app dependency) */
    document.getElementById('header-qr').addEventListener('click', function () {
      if (document.getElementById('qr-overlay')) return;
      var overlay = document.createElement('div');
      overlay.id = 'qr-overlay';
      overlay.innerHTML = '<img src="./assets/qrcode.png" alt="QR Code">';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function () { overlay.remove(); });
    });
  </script>
</body>
</html>
