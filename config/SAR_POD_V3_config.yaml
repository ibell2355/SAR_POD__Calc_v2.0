version: 4.0-spacing
name: SAR_POD_V4_spacing
description: >
  Spacing-based POD model. Effective sweep width divided by actual searcher
  spacing gives coverage factor. POD = 1 - exp(-coverage_factor).
units:
  distance: m
  probability: 0-1

search_types:
  missing_person:
    label: Missing Person
    base_sweep_width_m: 10
  historical_article:
    label: Historical Article
    base_sweep_width_m: 10
  evidence:
    label: Evidence
    base_sweep_width_m: 10

w_eff_bounds_m:
  min: 0.5
  max: 100

response_model:
  enabled_for:
  - missing_person
  auditory_bonus:
    none: 0.0
    possible: 0.04
    likely: 0.08
  visual_bonus:
    evade: -0.10
    none: 0.0
    possible: 0.015
    likely: 0.05
  max_total_multiplier: 1.25

condition_factors:
  missing_person:
    visibility:
      low: 1.1
      medium: 1.6
      high: 1.8
    time_of_day:
      day: 1.0
      dusk_dawn: 1.0
      night: 1.0
    weather:
      clear: 1.0
      rain: 1.0
      snow: 1.0
    vegetation_density:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
    micro_terrain_complexity:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
    extenuating_factors:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
  historical_article:
    visibility:
      low: 1.1
      medium: 1.6
      high: 1.8
    time_of_day:
      day: 1.0
      dusk_dawn: 1.0
      night: 1.0
    weather:
      clear: 1.0
      rain: 1.0
      snow: 1.0
    vegetation_density:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
    micro_terrain_complexity:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
    burial_or_cover:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
  evidence:
    visibility:
      low: 1.1
      medium: 1.6
      high: 1.8
    time_of_day:
      day: 1.0
      dusk_dawn: 1.0
      night: 1.0
    weather:
      clear: 1.0
      rain: 1.0
      snow: 1.0
    vegetation_density:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
    micro_terrain_complexity:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0
    burial_or_cover:
      '1': 1.0
      '2': 1.0
      '3': 1.0
      '4': 1.0
      '5': 1.0

ui_tooltips:
  visibility: How visible is the search target expected to be? Consider clothing color, camouflage, exposure vs concealment, and environmental contrast.
  auditory: Likelihood the missing person will respond to verbal calls or make noise.
  visual: Likelihood the missing person will signal visually or be actively trying to be seen.
  vegetation_density: Line-of-sight blockers such as tree and bush density, tall grass/brush, thick understory, canopy layering, slash/deadfall, and other vegetation that reduces effective sweep width.
  micro_terrain_complexity: Terrain features that reduce effective sweep width, like rocks/boulder fields, gullies, cutbanks, root wads, deadfall piles, depressions, and uneven ground.
  extenuating_factors: Catch-all for anything not already covered that makes detection easier or harder, such as heavy smoke/dust/fog, noise masking, altered landscape, or searcher experience.
  burial_or_cover: Degree of burial or concealment by debris, snow, duff, or other covering material.
  num_searchers: Number of searchers operating in this segment.
  actual_spacing: The actual spacing in meters between searchers as used in the field.

formulas:
  effective_sweep_width:
    text: "W_eff = clamp(base_sweep_width_m * K_vis * K_time * K_weather * K_veg * K_terrain * K_ext_or_burial * M_resp, min, max)\n"
  coverage_factor:
    text: "coverage_factor = W_eff / actual_spacing_m\n"
  final_pod:
    text: "POD = clamp(1 - exp(-coverage_factor), 0, 0.99)\n"

qa_flags:
  warn_if_spacing_m_gt: 50

calibration:
  notes:
  - All base sweep widths set to 10m as temporary calibration values.
  - 'Visibility coefficients calibrated: high=1.8, medium=1.6, low=1.1. All other coefficients at 1.0 pending calibration.'
  - 'Adjust in order: base_sweep_width_m per search type, then condition_factors per axis.'
  - Keep response bonuses small; they scale W_eff directly.
  - Do not allow POD to reach 1.00 (model clamps at 0.99).
  - 'Implementation note: numeric condition factor keys are strings ''1''..''5''; cast input to string for lookup.'
  - 'Implementation note: apply response_model only for search types listed in enabled_for; otherwise M_resp = 1.0.'

audit:
  save_inputs: true
  save_intermediate_values: true
  fields_to_log:
  - search_for
  - visibility
  - time_of_day
  - weather
  - actual_spacing_m
  - num_searchers
  - base_sweep_width_m
  - C_t
  - W_eff
  - M_resp
  - coverage_factor
  - POD
